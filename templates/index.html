<!DOCTYPE html>
<html>

<head>

    <title>SmartOps AI</title>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            margin:0;
        }

        .container{
            width:70%;
            margin:auto;
            margin-top:30px;
        }

        .chat-box{
            background:#1e293b;
            height:500px;
            overflow-y:auto;
            padding:20px;
            border-radius:10px;
        }

        .user{
            background:#2563eb;
            padding:10px;
            margin:10px;
            border-radius:10px;
            text-align:right;
        }

        .bot{
            background:#334155;
            padding:10px;
            margin:10px;
            border-radius:10px;
        }

        .input-area{
            display:flex;
            margin-top:20px;
        }

        input{
            flex:1;
            padding:15px;
            border:none;
            border-radius:10px;
            font-size:16px;
        }

        button{
            width:120px;
            margin-left:10px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }
        .bot table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .bot th {
            background: #2563eb;
            color: white;
            padding: 8px;
            text-align: left;
        }

        .bot td {
            padding: 8px;
            border-bottom: 1px solid #475569;
        }

        .bot h3 {
            margin-top: 0;
            color: #93c5fd;
        }

        .bot p {
            margin: 6px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>SmartOps AI Chatbot</h1>

    <div class="chat-box" id="chat-box"></div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask inventory question..."
        >
        <button onclick="startVoice()">
        🎤
        </button>
        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

async function sendMessage(){

    let input =
        document.getElementById("message")

    let message = input.value

    if(message.trim() === "")
        return

    let chatBox =
        document.getElementById("chat-box")

    chatBox.innerHTML += `
        <div class="user">
            ${message}
        </div>
    `

    input.value = ""

    let response = await fetch("/chat", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:message
        })

    })

    let data = await response.json()

    chatBox.innerHTML += `
        <div class="bot">
            ${data.reply}
        </div>
    `

    chatBox.scrollTop =
        chatBox.scrollHeight
}
function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition

    if(!SpeechRecognition){

        alert(
            "Voice typing only works in Google Chrome."
        )

        return
    }

    const recognition =
        new SpeechRecognition()

    recognition.lang = "en-US"

    recognition.interimResults = false

    recognition.maxAlternatives = 1

    recognition.start()

    recognition.onresult = function(event){

        const voiceText =
            event.results[0][0].transcript

        document
            .getElementById("message")
            .value = voiceText

        sendMessage()
    }

    recognition.onerror = function(event){

        alert(
            "Voice error: " + event.error
        )
    }
}
document
.getElementById("message")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        sendMessage()
    }

})

</script>

</body>
</html>
